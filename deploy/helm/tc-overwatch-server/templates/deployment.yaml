apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tc-overwatch-server.fullname" . }}
  labels:
    {{- include "tc-overwatch-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tc-overwatch-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tc-overwatch-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tc-overwatch-server.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- if .Values.cloudSqlAuthProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlAuthProxy.image }}
          args:
            - "--structured-logs"
            - "--port=5432"
            - {{ .Values.cloudSqlAuthProxy.instanceConnectionName | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        {{- end }}

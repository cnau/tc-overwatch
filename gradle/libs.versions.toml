# Centralized version catalog. All module build files reference these via `libs.*`.

[versions]
kotlin                  = "2.2.0"
springBoot              = "4.0.6"
springDepMgmt           = "1.1.7"
postgresJdbc            = "42.7.7"
testcontainers          = "1.21.3"
junit                   = "5.12.0"
mockk                   = "1.13.13"
assertk                 = "0.28.1"
detekt                  = "1.23.8"
# The Kotlin detekt 1.23.8 was compiled against. Pins detekt's analysis classpath only —
# see server/build.gradle.kts. Remove together with that block when detekt 2.0.0 ships.
detektEmbeddedKotlin    = "2.0.21"
ktlintPlugin            = "12.1.2"
springdocOpenapi        = "3.0.3"
aspectjweaver           = "1.9.22.1"

[libraries]
# Spring Boot BOM (pulls in Spring web, security, data-jpa, actuator, etc. via dependency-management plugin)
springBoot-starter-web              = { module = "org.springframework.boot:spring-boot-starter-web" }
springBoot-starter-security         = { module = "org.springframework.boot:spring-boot-starter-security" }
springBoot-starter-oauth2-client    = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
springBoot-starter-data-jpa         = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
springBoot-starter-actuator         = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBoot-starter-validation       = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBoot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

# Spring Boot 4 dropped spring-boot-starter-aop — pull aspectjweaver directly (spring-aop comes via other starters).
aspectjweaver                       = { module = "org.aspectj:aspectjweaver", version.ref = "aspectjweaver" }
springBoot-starter-test             = { module = "org.springframework.boot:spring-boot-starter-test" }

# OpenAPI / Swagger UI — walks @RestControllers, Jackson + Bean Validation annotations,
# Kotlin nullability. 3.x is the Spring Boot 4 / Spring Framework 7 line.
springdoc-openapi-webmvc-ui         = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

# Persistence (Liquibase lives in the separate `migrate` Docker image — `migrate/Dockerfile`)
postgres-jdbc                       = { module = "org.postgresql:postgresql", version.ref = "postgresJdbc" }

# Kotlin
kotlin-reflect                      = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib                       = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Testing
junit-bom                           = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter                       = { module = "org.junit.jupiter:junit-jupiter" }
mockk                               = { module = "io.mockk:mockk", version.ref = "mockk" }
assertk                             = { module = "com.willowtreeapps.assertk:assertk-jvm", version.ref = "assertk" }
testcontainers-bom                  = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit                = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgres             = { module = "org.testcontainers:postgresql" }

# Plugin classpath entries (referenced by id below)
[plugins]
kotlin-jvm                          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring                       = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa                          = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
springBoot                          = { id = "org.springframework.boot", version.ref = "springBoot" }
springDepMgmt                       = { id = "io.spring.dependency-management", version.ref = "springDepMgmt" }
detekt                              = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint                              = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }

# Unraid pilot stack. Setup, Cloudflare Tunnel, image tags and rollback:
# docs/unraid-stack.md. Always pass --env-file /mnt/user/tco/.env.

# Pinned so a CI checkout and a hand-run from /mnt/user/tco/repo are one
# project (docs/architecture.md § Unraid deploy).
name: tco

services:
  postgres:
    image: postgres:18
    container_name: tco-postgres
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env
    volumes:
      - /mnt/user/tco/postgres:/var/lib/postgresql
      - ./scripts/db-init-unraid:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tco-net

  migrate:
    image: ghcr.io/cnau/tc-overwatch-migrate:${TCO_MIGRATE_TAG:-main}
    container_name: tco-migrate
    restart: "no"
    env_file:
      - /mnt/user/tco/.env
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?missing — pass --env-file /mnt/user/tco/.env}
      LIQUIBASE_COMMAND_USERNAME: tco_migrate
      LIQUIBASE_COMMAND_PASSWORD: ${TCO_MIGRATE_PASSWORD:?missing — pass --env-file /mnt/user/tco/.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tco-net

  backend:
    image: ghcr.io/cnau/tc-overwatch-server:${TCO_SERVER_TAG:-main}
    container_name: tco-backend
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env
    environment:
      SPRING_PROFILES_ACTIVE: unraid
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - tco-net
    # Healthcheck is declared in server/Dockerfile (image-level HEALTHCHECK).

  cloudflared:
    # To bump: docker pull cloudflare/cloudflared:<new-tag>; copy the printed digest here.
    image: cloudflare/cloudflared:2026.5.1@sha256:a5b5e6fd9a372f054b9a843c219bfbcdceb54691605312a8b1ee72978bdf1aa1
    container_name: tco-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?missing — pass --env-file /mnt/user/tco/.env}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - tco-net

  frontend:
    image: ghcr.io/cnau/tc-overwatch-frontend:${TCO_FRONTEND_TAG:-main}
    container_name: tco-frontend
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env
    environment:
      # Fail-fast guard: the SPA needs an absolute backend URL baked into
      # /config.js at container start (see frontend/docker-entrypoint.d/).
      # Empty value = silently-broken cross-origin in the browser.
      APP_API_BASE_URL: ${APP_API_BASE_URL:?missing — pass --env-file /mnt/user/tco/.env}
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens IPv4-only and the container's
      # localhost resolves to ::1 first.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - tco-net

networks:
  tco-net:
    driver: bridge

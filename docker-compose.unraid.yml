# Unraid pilot stack. Bring up via:
#
#   docker compose -f docker-compose.unraid.yml \
#     --env-file /mnt/user/tco/.env up -d
#
# Two independent uses of the same .env file:
#   - `--env-file` feeds compose's ${VAR} interpolation in THIS file.
#   - `env_file:` directives below pass variables through to each container.
# Forgetting `--env-file` fails fast with a clear "missing X" error (via the
# ${VAR:?...} fallbacks below), rather than silently substituting empty
# strings. The .env file lives at /mnt/user/tco/.env with mode 0600, outside
# the repo. See .env.unraid.example for the required keys.
#
# cloudflared (Cloudflare Tunnel connector) is still deferred — blocked on
# tunnel hostname registration (#74) and the production OAuth client (#75).

services:
  postgres:
    image: postgres:18
    container_name: tco-postgres
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env
    volumes:
      - /mnt/user/tco/postgres:/var/lib/postgresql
      - ./scripts/db-init-unraid:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tco-net

  migrate:
    image: ghcr.io/cnau/tc-overwatch-migrate:main
    container_name: tco-migrate
    restart: "no"
    env_file:
      - /mnt/user/tco/.env
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?missing — pass --env-file /mnt/user/tco/.env}
      LIQUIBASE_COMMAND_USERNAME: tco_migrate
      LIQUIBASE_COMMAND_PASSWORD: ${TCO_MIGRATE_PASSWORD:?missing — pass --env-file /mnt/user/tco/.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tco-net

  backend:
    image: ghcr.io/cnau/tc-overwatch-server:main
    container_name: tco-backend
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env
    environment:
      SPRING_PROFILES_ACTIVE: unraid
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - tco-net
    # Healthcheck deferred: the eclipse-temurin:23-jre base lacks curl/wget,
    # and nothing else in the stack currently depends_on backend's health.

  frontend:
    image: ghcr.io/cnau/tc-overwatch-frontend:main
    container_name: tco-frontend
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env
    environment:
      # Fail-fast guard: the SPA needs an absolute backend URL baked into
      # /config.js at container start (see frontend/docker-entrypoint.d/).
      # Empty value = silently-broken cross-origin in the browser.
      APP_API_BASE_URL: ${APP_API_BASE_URL:?missing — pass --env-file /mnt/user/tco/.env}
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens IPv4-only and the container's
      # localhost resolves to ::1 first.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - tco-net

networks:
  tco-net:
    driver: bridge

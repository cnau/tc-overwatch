name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two parallel build pipelines per docs/architecture.md § CI/CD.
# Deploy jobs (deploy-unraid-*, deploy-prod-*) are not wired yet — they land
# alongside the self-hosted runner setup in a follow-up PR.

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew :server:build --stacktrace

      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint


name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two parallel build pipelines per docs/architecture.md § CI/CD.
# build-and-push-* land the runtime images in GHCR on every main-branch
# commit; deploy jobs (deploy-unraid-*, deploy-prod-*) pull from GHCR and
# come later with the self-hosted runner setup.

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew :server:build --stacktrace

      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

  # FE/BE type-sync gate. Boot Postgres + backend, regenerate frontend types from
  # /v3/api-docs, fail if the committed file drifted from a fresh regen.
  api-type-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot Postgres (compose mounts the role-provisioning init script)
        run: docker compose -f docker-compose.local.yml up -d --wait postgres

      - name: Build migrate image
        run: docker compose -f docker-compose.local.yml build migrate

      - name: Apply migrations
        run: docker compose -f docker-compose.local.yml run --rm migrate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Boot backend in background
        run: |
          ./gradlew :server:bootRun --args='--spring.profiles.active=local' > /tmp/server.log 2>&1 &

      - name: Wait for /v3/api-docs
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/v3/api-docs >/dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not expose /v3/api-docs in 90s"
          tail -100 /tmp/server.log
          exit 1

      - name: Regenerate types
        working-directory: frontend
        run: npm run gen-api-types

      - name: Fail on drift
        run: |
          if ! git diff --exit-code frontend/src/gen/; then
            echo "::error::frontend/src/gen/ is out of sync with the backend OpenAPI spec."
            echo "Run \`npm --prefix frontend run gen-api-types\` locally and commit the result."
            exit 1
          fi

  # Image build + push. Main-branch commits only; PRs validate via build-server
  # but don't publish. The same image (one set of tags per SHA) is the artifact
  # for both Unraid pilot and future GCP prod deploys.
  build-and-push-server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: ./gradlew :server:bootJar --stacktrace

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "ghcr.io/cnau/tc-overwatch-server:sha-${SHORT_SHA}"
            echo "ghcr.io/cnau/tc-overwatch-server:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Stop GHCR from accumulating every commit's image forever. Keep the
      # 5 most recent versions (latest carries :main + :sha-<short>; older
      # 4 keep only their :sha-<short>). When we move to tagged releases,
      # this prune can be tightened to keep :v* tags indefinitely.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tc-overwatch-server
          package-type: container
          min-versions-to-keep: 5

  # Frontend image — Nginx + static Vite bundle. Gated on build-frontend so
  # the published image always reflects a passing type-check + lint + bundle.
  build-and-push-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "ghcr.io/cnau/tc-overwatch-frontend:sha-${SHORT_SHA}"
            echo "ghcr.io/cnau/tc-overwatch-frontend:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tc-overwatch-frontend
          package-type: container
          min-versions-to-keep: 5

  # Liquibase migration image. Gated on build-server so the migrate image and
  # the server image stay versioned in lockstep on the `:main` tag — entities
  # and changelogs are coupled by JPA's ddl-auto validate at backend startup.
  build-and-push-migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "ghcr.io/cnau/tc-overwatch-migrate:sha-${SHORT_SHA}"
            echo "ghcr.io/cnau/tc-overwatch-migrate:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: migrate/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tc-overwatch-migrate
          package-type: container
          min-versions-to-keep: 5

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build + deploy pipelines per docs/architecture.md § CI/CD.
# build-and-push-* land the runtime images in GHCR on every main-branch
# commit; deploy-unraid-* pull those images onto the Unraid pilot box via the
# self-hosted runner (docs/unraid-runner.md). deploy-prod-* come later.
#
# SECURITY — this repo is public, and the deploy jobs run on a self-hosted
# runner sitting on a home network with the host Docker socket mounted. The
# `if: github.event_name == 'push' && github.ref == 'refs/heads/main'` guard on
# every self-hosted job is what keeps a forked pull request from executing
# attacker-authored steps there. Never drop that guard, and never add
# `runs-on: [self-hosted, unraid]` to a job reachable from `pull_request`.

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew :server:build --stacktrace

      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

  # FE/BE type-sync gate. Boot Postgres + backend, regenerate frontend types from
  # /v3/api-docs, fail if the committed file drifted from a fresh regen.
  api-type-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot Postgres (compose mounts the role-provisioning init script)
        run: docker compose -f docker-compose.local.yml up -d --wait postgres

      - name: Build migrate image
        run: docker compose -f docker-compose.local.yml build migrate

      - name: Apply migrations
        run: docker compose -f docker-compose.local.yml run --rm migrate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Boot backend in background
        run: |
          ./gradlew :server:bootRun --args='--spring.profiles.active=local' > /tmp/server.log 2>&1 &

      - name: Wait for /v3/api-docs
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/v3/api-docs >/dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not expose /v3/api-docs in 90s"
          tail -100 /tmp/server.log
          exit 1

      - name: Regenerate types
        working-directory: frontend
        run: npm run gen-api-types

      - name: Fail on drift
        run: |
          if ! git diff --exit-code frontend/src/gen/; then
            echo "::error::frontend/src/gen/ is out of sync with the backend OpenAPI spec."
            echo "Run \`npm --prefix frontend run gen-api-types\` locally and commit the result."
            exit 1
          fi

  # Image build + push. Main-branch commits only; PRs validate via build-server
  # but don't publish. The same image (one set of tags per SHA) is the artifact
  # for both Unraid pilot and future GCP prod deploys.
  build-and-push-server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: ./gradlew :server:bootJar --stacktrace

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "ghcr.io/cnau/tc-overwatch-server:sha-${SHORT_SHA}"
            echo "ghcr.io/cnau/tc-overwatch-server:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Stop GHCR from accumulating every commit's image forever. Keep the
      # 5 most recent versions (latest carries :main + :sha-<short>; older
      # 4 keep only their :sha-<short>). When we move to tagged releases,
      # this prune can be tightened to keep :v* tags indefinitely.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tc-overwatch-server
          package-type: container
          min-versions-to-keep: 5

  # Frontend image — Nginx + static Vite bundle. Gated on build-frontend so
  # the published image always reflects a passing type-check + lint + bundle.
  build-and-push-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "ghcr.io/cnau/tc-overwatch-frontend:sha-${SHORT_SHA}"
            echo "ghcr.io/cnau/tc-overwatch-frontend:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tc-overwatch-frontend
          package-type: container
          min-versions-to-keep: 5

  # Liquibase migration image. Gated on build-server so the migrate image and
  # the server image stay versioned in lockstep on the `:main` tag — entities
  # and changelogs are coupled by JPA's ddl-auto validate at backend startup.
  build-and-push-migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "ghcr.io/cnau/tc-overwatch-migrate:sha-${SHORT_SHA}"
            echo "ghcr.io/cnau/tc-overwatch-migrate:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: migrate/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tc-overwatch-migrate
          package-type: container
          min-versions-to-keep: 5

  # Unraid pilot deploy — backend half. Needs the migrate image too: the
  # schema is applied by a one-shot migrate container built from the same
  # commit, so an entity change and its changeset ship together or not at all.
  #
  # Serial by construction: migrate runs to completion, then the backend
  # restarts. A failed migration fails the job before the new backend image is
  # ever started, so the old container keeps serving instead of crash-looping
  # against a half-migrated schema.
  deploy-unraid-server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-push-server, build-and-push-migrate]
    runs-on: [self-hosted, unraid]
    permissions:
      contents: read
      packages: read
    # Two deploys touching the same compose project at once corrupts the
    # stack. Queue rather than cancel — a cancelled deploy could leave the
    # migrate container half-applied.
    concurrency:
      group: deploy-unraid-server
      cancel-in-progress: false
    env:
      # Every compose invocation needs the same -f and --env-file; spelling it
      # once keeps the steps readable and copy-pasteable onto the box.
      COMPOSE: docker compose -f docker-compose.unraid.yml --env-file /mnt/user/tco/.env
    steps:
      - uses: actions/checkout@v4

      # Both services move to this commit's immutable tag. Without this the
      # deploy would pull whatever `main` points at, which on a busy merge day
      # is not necessarily the commit that triggered this run.
      - name: Pin image tags to this commit
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "TCO_SERVER_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "TCO_MIGRATE_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull server + migrate images
        run: $COMPOSE pull backend migrate

      - name: Run DB migrations (one-shot container)
        run: $COMPOSE run --rm migrate

      # --no-deps because the previous step already satisfied them. Without it
      # compose re-evaluates backend's `depends_on: migrate
      # (service_completed_successfully)` and starts the migrate *service*
      # container to satisfy it — a second, redundant Liquibase run whose
      # failure would surface as a confusing backend-restart failure rather
      # than as the migration step.
      - name: Restart backend
        run: $COMPOSE up -d --no-deps backend

      - name: Wait for healthcheck
        run: ./scripts/wait-for-healthy.sh tco-backend 180

      - name: Smoke test
        run: ./scripts/smoke.sh api

      # The Actions log otherwise ends at "unhealthy" with no stack trace, and
      # the container may already have been restarted by the time anyone SSHes in.
      - name: Backend logs on failure
        if: failure()
        run: docker logs --tail 200 tco-backend || true

  # Unraid pilot deploy — frontend half. Independent of the backend deploy by
  # design: no `needs` on it, its own concurrency group, and a smoke test
  # scoped to the app hostname. Either half can ship while the other is broken.
  deploy-unraid-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-push-frontend]
    runs-on: [self-hosted, unraid]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-unraid-frontend
      cancel-in-progress: false
    env:
      COMPOSE: docker compose -f docker-compose.unraid.yml --env-file /mnt/user/tco/.env
    steps:
      - uses: actions/checkout@v4

      - name: Pin image tag to this commit
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "TCO_FRONTEND_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull frontend image
        run: $COMPOSE pull frontend

      - name: Restart frontend
        run: $COMPOSE up -d frontend

      - name: Wait for healthcheck
        run: ./scripts/wait-for-healthy.sh tco-frontend 60

      - name: Smoke test
        run: ./scripts/smoke.sh app

      - name: Frontend logs on failure
        if: failure()
        run: docker logs --tail 200 tco-frontend || true

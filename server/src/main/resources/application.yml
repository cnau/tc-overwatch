# Base config — overlaid by profile-specific files (application-local.yml, application-unraid.yml, application-prod.yml).
# Secrets never live in this file; they come from env vars or the Spring profile's resolved secret source.

spring:
  application:
    name: tc-overwatch
    version: 0.0.1

  # Liquibase migration changelog. In production, migrations are run by a one-shot
  # `migrate` container (the `tco_migrate` DB role) before the backend starts, with
  # `spring.liquibase.enabled=false` set via that profile. Local-dev runs migrations
  # at app startup using the autoconfig default (enabled when on the classpath).
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.groovy
    # App data lives in `tco`. Liquibase's own bookkeeping tables
    # (databasechangelog, databasechangeloglock) stay in `public` — they're
    # framework infrastructure, not domain data.
    default-schema: tco
    liquibase-schema: public

  jpa:
    hibernate:
      ddl-auto: validate   # never auto-modify schema; Liquibase owns it
    properties:
      hibernate:
        format_sql: false
        default_schema: tco   # entities resolve to `tco.<table>` without per-@Table annotation
    open-in-view: false    # avoid OSIV antipattern; DAOs return DTOs, not entities

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.tcoverwatch: DEBUG

# See docs/architecture.md § Authentication.
auth:
  jwt:
    # Required. `auth.jwt.secret` comes from AUTH_JWT_SECRET (Secret Manager-backed
    # in prod); application-local.yml has its own value.
    token-lifetime: 7d

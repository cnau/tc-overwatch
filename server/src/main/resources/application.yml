# Base config — overlaid by profile-specific files (application-local.yml, application-unraid.yml, application-prod.yml).
# Secrets never live in this file; they come from env vars or the Spring profile's resolved secret source.

spring:
  application:
    name: tc-overwatch-server

  # Liquibase migration changelog. In production, migrations are run by a one-shot
  # `migrate` container (the `tco_migrate` DB role) before the backend starts, with
  # `spring.liquibase.enabled=false` set via that profile. Local-dev runs migrations
  # at app startup using the autoconfig default (enabled when on the classpath).
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.groovy

  jpa:
    hibernate:
      ddl-auto: validate   # never auto-modify schema; Liquibase owns it
    properties:
      hibernate:
        format_sql: false
    open-in-view: false    # avoid OSIV antipattern; DAOs return DTOs, not entities

  jackson:
    default-property-inclusion: non_null

  # spring-grpc serves gRPC over the Spring MVC servlet on :8080 (same port as HTTP) when
  # spring-grpc-server-web is on the classpath. Same proto handlers serve native gRPC clients
  # (grpcurl via h2c) AND browser gRPC-Web / Connect through one endpoint. Native-only mode
  # (separate :9090 port) is not used — single-port keeps deployment, CORS, and proxy config
  # simpler. Reflection auto-enabled for grpcurl convenience.
  grpc:
    server:
      reflection:
        enabled: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.tcoverwatch: DEBUG

# Base config — overlaid by profile-specific files (application-local.yml, application-unraid.yml, application-prod.yml).
# Secrets never live in this file; they come from env vars or the Spring profile's resolved secret source.

spring:
  application:
    name: tc-overwatch
    version: 0.0.1

  jpa:
    hibernate:
      ddl-auto: validate   # never auto-modify schema; Liquibase owns it
    properties:
      hibernate:
        format_sql: false
        default_schema: tco   # entities resolve to `tco.<table>` without per-@Table annotation
    open-in-view: false    # avoid OSIV antipattern; DAOs return DTOs, not entities

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.tcoverwatch: DEBUG

# See docs/architecture.md § Authentication.
auth:
  # Signup gate. invitation (v0 default) | open | paid. Enforced server-side on every
  # sign-in attempt — never branched on by the frontend.
  signup-mode: invitation
  jwt:
    # Required. `auth.jwt.secret` comes from AUTH_JWT_SECRET (Secret Manager-backed
    # in prod); application-local.yml has its own value.
    token-lifetime: 7d

# Where the OAuth success handler sends the SPA back. Profile-overridden.
app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}

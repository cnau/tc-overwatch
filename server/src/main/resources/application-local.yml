# Local-dev profile. Activate via SPRING_PROFILES_ACTIVE=local or ./gradlew bootRun --args='--spring.profiles.active=local'.
# Pairs with docker-compose.local.yml — start that first, then start the server.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tco
    username: tco_app
    password: tco_app_local_password
    driver-class-name: org.postgresql.Driver

  # In local dev, Liquibase runs at startup for convenience (no separate migrate container).
  # Migrations run as tco_migrate so (a) tables are owned by a different role than
  # the app uses, which means RLS actually filters tco_app's queries (owners
  # bypass RLS by default), and (b) only tco_migrate has CREATE on public for
  # Liquibase's own bookkeeping tables.
  liquibase:
    enabled: true
    user: tco_migrate
    password: tco_migrate_local_password

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

auth:
  jwt:
    # Local-dev only. HS256 needs ≥32 bytes; this string isn't a real secret.
    secret: "tc-overwatch-local-dev-jwt-secret-do-not-use-in-prod"
  cookie:
    secure: false  # Secure=true would block the cookie over plain HTTP

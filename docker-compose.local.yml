# Local-dev infrastructure. Bring up Postgres before running the server.
#
#   docker compose -f docker-compose.local.yml up -d
#
# Then run the server from your IDE or:
#   ./gradlew :server:bootRun --args='--spring.profiles.active=local'
#
# Frontend separately:
#   cd frontend && npm run dev

services:
  postgres:
    image: postgres:18
    container_name: tco-postgres
    environment:
      POSTGRES_DB: tco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
    ports:
      - "5432:5432"
    volumes:
      - tco-postgres-data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tco"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tco-postgres-data:

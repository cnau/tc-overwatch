# Self-hosted GitHub Actions runner that deploys the Unraid stack. Setup,
# security constraints and operations: docs/unraid-runner.md — read it first.

name: tco-runner

services:
  runner:
    # To bump: docker pull myoung34/github-runner:<new-tag>; copy the printed digest here.
    image: myoung34/github-runner:2.336.0-ubuntu-noble@sha256:c803ddbc5b91961aabf3411c6336cb2c838cdaa2f917f76654c15a1948934817
    container_name: tco-runner
    restart: unless-stopped
    env_file:
      - /mnt/user/tco/.env.runner
    environment:
      REPO_URL: https://github.com/cnau/tc-overwatch
      RUNNER_NAME: unraid
      RUNNER_SCOPE: repo
      # `self-hosted` is applied by GitHub automatically; this adds the second
      # half of the `runs-on: [self-hosted, unraid]` selector.
      LABELS: unraid
      RUNNER_WORKDIR: /mnt/user/tco/runner/_work
      # The image pins its own runner version and we pin its digest; letting it
      # self-update would silently drift off the pinned artifact.
      DISABLE_AUTO_UPDATE: "true"
      # Register once and reuse it across restarts; the image's default of
      # re-registering on every start loops on restart. Required as a pair.
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /mnt/user/tco/runner/state
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    volumes:
      # Root-equivalent on the host — docs/unraid-runner.md § Security constraints.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path on both sides: compose bind mounts resolve on the
      # host daemon, so any other path silently mounts an empty directory.
      - /mnt/user/tco/runner/_work:/mnt/user/tco/runner/_work
      # Holds the runner's private key — outside _work, created 0700.
      - /mnt/user/tco/runner/state:/mnt/user/tco/runner/state
      # --env-file and env_file: are read by the compose client, which runs in
      # here; without this every deploy dies on "couldn't find env file".
      - /mnt/user/tco/.env:/mnt/user/tco/.env:ro

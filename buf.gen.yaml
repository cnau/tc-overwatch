# Buf is used for *frontend* codegen (TypeScript Connect-ES client).
# Backend Kotlin/Java stubs are generated by the Gradle protobuf plugin (see proto/build.gradle.kts).
version: v2
plugins:
  - remote: buf.build/bufbuild/es
    out: frontend/src/gen
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/connectrpc/es
    out: frontend/src/gen
    opt:
      - target=ts
      - import_extension=js

# Deviations from detekt's defaults only (`buildUponDefaultConfig = true`), each with its
# reason. ktlint owns formatting, detekt owns structure: where they overlap, the detekt rule
# is disabled here rather than running two thresholds on one question.

complexity:
  # One handler function per exception type is the correct shape for @RestControllerAdvice —
  # ApiErrorAdvice has 17 and should. Splitting it would fragment the error envelope to
  # satisfy a metric.
  TooManyFunctions:
    ignoreAnnotated: ['RestControllerAdvice']

  # JPA entities carry audit columns (id, createdBy, createdAt, updatedBy, updatedAt,
  # tenantId) on top of their domain fields, so 7-10 constructor parameters is inherent to
  # the shape. They can't be data classes (JPA needs stable equals/hashCode), so detekt's
  # ignoreDataClasses default doesn't cover them.
  LongParameterList:
    ignoreAnnotated: ['Entity']

style:
  # ktlint already enforces line length, at a higher limit than detekt's 120 default, and
  # passes on the current code. Owning it in one place means one number to argue about.
  MaxLineLength:
    active: false

  # Guard-clause chains are the idiom for validation gates: resolveVerifiedEmail's three
  # distinct error codes would merge into two, losing operator diagnostics.
  ThrowsCount:
    excludeGuardClauses: true

  # Spring resolves @ExceptionHandler methods by parameter *type*, so the exception parameter
  # is a framework contract even when the body ignores it — handleUnreadableBody deliberately
  # won't leak parser internals, handleNoResource returns a generic 404.
  UnusedParameter:
    ignoreAnnotated: ['ExceptionHandler']
